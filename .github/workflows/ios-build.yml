name: iOS Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build BankingApp (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List simulators
        run: xcrun simctl list devices available | head -n 40

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project BankingApp.xcodeproj \
            -scheme BankingApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify || xcodebuild \
            -project BankingApp.xcodeproj \
            -scheme BankingApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
