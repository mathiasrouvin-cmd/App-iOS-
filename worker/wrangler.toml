# Declared here so Git-triggered deploys don't wipe them.
# Secrets (APP_SECRET, APP_PRIVATE_KEY) are managed separately by
# Cloudflare and survive deploys; they are NOT in this file.
[vars]
APP_ID = "fabb70a2-2d22-4fc8-a0e6-1563d3074cbd"
PWA_URL = "https://mathiasrouvin-cmd.github.io/App-iOS-/"

[[kv_namespaces]]
binding = "KV"
id = "63dce13351ee4caba9f2a44fe0f3d0bd"
